AWSTemplateFormatVersion: '2010-09-09'
Description: Anomaly Detection Stack

Parameters:
  MyIpAddress:
    Type: String
    Description: Your IP in CIDR notation (e.g. 1.2.3.4/32)
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:

  AnomalyBucket:
    Type: AWS::S3::Bucket
    DependsOn: SNSTopicPolicy
    Properties:
      NotificationConfiguration:
        TopicConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .csv
            Topic: !Ref AnomalySNSTopic

  AnomalySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ds5220-dp1

  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AnomalySNSTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AnomalySNSTopic

  AnomalySNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AnomalySNSTopic
      Protocol: http
      Endpoint: !Sub 'http://${AnomalyEIP}:8000/notify'

  AnomalyEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3BucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AnomalyBucket.Arn
                  - !Sub '${AnomalyBucket.Arn}/*'

  AnomalyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AnomalyEC2Role

  AnomalySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from my IP, API from anywhere
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpAddress
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0

  AnomalyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0f9de6e2d2f067fca  
      InstanceType: t3.micro
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref AnomalyInstanceProfile
      SecurityGroupIds:
        - !Ref AnomalySecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 16
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/user-data.log 2>&1

            apt-get update -y
            apt-get install -y python3 python3-pip python3-venv git

            export BUCKET_NAME='${AnomalyBucket}'
            echo "BUCKET_NAME='${AnomalyBucket}'" >> /etc/environment

            APP_DIR=/home/ubuntu/anomaly-detection
            git clone https://github.com/corinnefog/anomaly-detection.git "$APP_DIR"
            chown -R ubuntu:ubuntu "$APP_DIR"

            python3 -m venv "$APP_DIR/venv"
            source "$APP_DIR/venv/bin/activate"
            pip install --upgrade pip
            pip install -r "$APP_DIR/requirements.txt"
            pip install "fastapi[standard]"
            deactivate

            cat > /etc/systemd/system/anomaly-detection.service << 'EOF'
            [Unit]
            Description=Anomaly Detection FastAPI
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu/anomaly-detection
            Environment="BUCKET_NAME=${AnomalyBucket}"
            ExecStart=/home/ubuntu/anomaly-detection/venv/bin/fastapi run app.py --host 0.0.0.0 --port 8000
            Restart=on-failure

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable anomaly-detection.service
            systemctl start anomaly-detection.service

  AnomalyEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  AnomalyEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref AnomalyEC2Instance
      EIP: !Ref AnomalyEIP

Outputs:
  ElasticIP:
    Value: !Ref AnomalyEIP
  BucketName:
    Value: !Ref AnomalyBucket
  SSHCommand:
    Value: !Sub 'ssh -i ~/.ssh/${KeyPairName}.pem ubuntu@${AnomalyEIP}'# cloudformation solution goes here
